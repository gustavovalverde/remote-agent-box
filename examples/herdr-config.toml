# Herdr baseline for supervising native harness CLIs (as of 2026-09, Herdr 0.9.x).
# Copy to ~/.config/herdr/config.toml, then run: herdr server reload-config
# Reasons for each setting: docs/do/08-optional-multiplexer.md

[terminal]
# New panes start in the current repository or worktree.
new_cwd = "follow"

[worktrees]
# Keeps agent checkouts outside the source repository.
directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 32
# A stray keypress cannot close a workspace that holds a running agent.
confirm_close = true
prompt_new_workspace_name = true
# Agents that need you sort to the top.
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[session]
# Relaunches integrated agents with their native resume command after a server restart.
resume_agents_on_restore = true

[advanced]
# 50 MiB per pane, for reviewing long agent sessions.
scrollback_limit_bytes = 52428800

[experimental]
# Trade-off: keeps recent pane output across a server restart, and writes prompts,
# code, logs and secrets to session-history.json. Set to false to avoid that file.
pane_history = true

# Optional Annotate plugin. Read its code first, then install at a pinned commit
# (plugins run with your user privileges):
#   herdr plugin install plannotator/herdr-annotate --ref <commit>
# These bindings avoid prefix+o, which opens the notification target.
#
# [[keys.command]]
# key = "prefix+a"
# type = "plugin_action"
# command = "annotate.capture"
# description = "Annotate selected terminal text"
#
# [[keys.command]]
# key = "prefix+shift+a"
# type = "plugin_action"
# command = "annotate.copy-context"
# description = "Copy annotations as agent context"
#
# [[keys.command]]
# key = "prefix+i"
# type = "plugin_action"
# command = "annotate.open"
# description = "Review documents in the current folder"
#
# [[keys.command]]
# key = "prefix+shift+i"
# type = "plugin_action"
# command = "annotate.last"
# description = "Review the agent's last reply"
